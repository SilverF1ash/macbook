name: MacBook deal watcher
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macbook-deal-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check feeds and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watcher.py
      - name: Persist delivery history even after partial failure
        if: always()
        run: |
          if [ -f state/seen.json ]; then
            git config user.name 'MacBook Deal Watcher'
            git config user.email 'actions@users.noreply.github.com'
            git add state/seen.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update deal alert history [skip ci]'
              git push
            fi
          fi
